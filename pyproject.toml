[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bstabdiff"
version = "0.2.0"
description = "BSTabDiff: Block-Subunit Diffusion Priors for High-Dimensional Tabular Data Generation (NeurIPS 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Al Zadid Sultan Bin Habib" },
  { name = "Md Younus Ahamed" },
  { name = "Prashnna Kumar Gyawali" },
  { name = "Gianfranco Doretto" },
  { name = "Donald A. Adjeroh" }
]

keywords = [
  "tabular-data",
  "high-dimensional-data",
  "HDLSS",
  "synthetic-data",
  "generative-modeling",
  "diffusion",
  "normalizing-flow",
  "feature-ordering",
  "GO-BS",
  "missing-data",
  "mixed-type-data",
  "neurips"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "matplotlib==3.10.8",
  "tqdm==4.67.3",
  "torch==2.5.1",
  "catboost==1.2.8",
  "tabpfn==6.3.1",
  "kmeans_gpu==0.0.5",
  "optuna==4.8.0",
  "psutil==7.0.0",
  "codecarbon==3.2.6",
  "jupyter==1.1.1",
  "ipykernel==7.2.0"
]

[project.urls]
Homepage = "https://github.com/zadid6pretam/BSTabDiff"
Repository = "https://github.com/zadid6pretam/BSTabDiff"
Issues = "https://github.com/zadid6pretam/BSTabDiff/issues"
Paper = "https://openreview.net/forum?id=RKNDy0KhGT"

[tool.setuptools.packages.find]
where = ["."]
include = ["bstabdiff*"]
