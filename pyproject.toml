
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bstabdiff"
version = "0.2.1"
description = "BSTabDiff: Block-Subunit Diffusion Priors for High-Dimensional Tabular Data Generation (NeurIPS 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Al Zadid Sultan Bin Habib" },
  { name = "Md Younus Ahamed" },
  { name = "Prashnna Kumar Gyawali" },
  { name = "Gianfranco Doretto" },
  { name = "Donald A. Adjeroh" }
]

keywords = [
  "tabular-data",
  "high-dimensional-data",
  "HDLSS",
  "synthetic-data",
  "generative-modeling",
  "diffusion",
  "normalizing-flow",
  "feature-ordering",
  "GO-BS",
  "missing-data",
  "mixed-type-data",
  "neurips"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
  "numpy>=2.2.6,<3.0",
  "pandas>=2.2.3,<3.0",
  "scikit-learn>=1.7.2,<2.0",
  "scipy>=1.15.3,<2.0",
  "matplotlib>=3.10.8,<4.0",
  "tqdm>=4.67.3,<5.0",
  "torch>=2.5.1,<3.0",
  "kmeans_gpu==0.0.5",
  "optuna>=4.8.0,<5.0",
  "psutil>=7.0.0,<8.0",
  "codecarbon>=3.2.6,<4.0"
]

[project.urls]
Homepage = "https://www.zadidhabib.com/bstabdiff.html"
Repository = "https://github.com/zadid6pretam/BSTabDiff"
Issues = "https://github.com/zadid6pretam/BSTabDiff/issues"
Paper = "https://openreview.net/forum?id=ciPCMXX1aj"

[tool.setuptools.packages.find]
where = ["."]
include = ["bstabdiff*"]
